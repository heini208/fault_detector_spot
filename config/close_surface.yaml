/**:
  ros__parameters:
    close_surface.robot_name: ''

    close_surface.settle_sec: 0.5
    # Collection budget after settling; newest valid depth must still be fresh.
    close_surface.sample_timeout_sec: 6.0
    # Slow camera excursion and verified return around the fixed probe target.
    close_surface.observation_speed_mps: 0.010
    # Include the slower round trip and bounded return corrections.
    close_surface.maximum_measurement_duration_sec: 120.0

    close_surface.maximum_step_m: 0.010
    close_surface.tolerance_m: 0.005
    close_surface.maximum_travel_m: 0.400
    close_surface.maximum_approach_steps: 60

    close_surface.minimum_surface_samples: 5
    close_surface.minimum_surface_span_sec: 1.0
    close_surface.surface_stability_tolerance_m: 0.005

    close_surface.force_contact_threshold_n: 5.0
    close_surface.force_near_target_threshold_n: 3.0
    close_surface.force_near_target_distance_m: 0.020

    close_surface.approach_far_speed_mps: 0.01
    close_surface.approach_near_speed_mps: 0.002
    # Zero-distance contact search uses its own slower, more sensitive guard.
    # Contact backoff uses the command tolerance, falling back to tolerance_m.
    close_surface.contact_search_speed_mps: 0.001
    close_surface.contact_search_force_threshold_n: 2.0
    close_surface.approach_slowdown_distance_m: 0.050
    close_surface.contact_search_overtravel_m: 0.005

    close_surface.recovery_speed_mps: 0.020

    close_surface.maximum_lateral_drift_m: 0.010
    # Measurement normal consistency and verified orientation remain at 5 degrees.
    close_surface.maximum_axis_error_rad: 0.08726646259971647
    # Approach allows 10 degrees, reserving 1 degree before starting motion.
    close_surface.maximum_approach_axis_error_rad: 0.17453292519943295
    close_surface.approach_alignment_margin_rad: 0.017453292519943295
    # Allow bounded body compliance after measurement; observation/return
    # retain their separate 10 mm reference tolerance. Rotation remains 2 degrees.
    close_surface.approach_body_position_tolerance_m: 0.020
    close_surface.minimum_step_progress_ratio: 0.25
