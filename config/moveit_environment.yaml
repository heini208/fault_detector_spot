# The launch argument adds lidar when its cloud has a physical sensor origin.
/move_group:
  ros__parameters:
    octomap_frame: body
    octomap_resolution: 0.04
    sensors: [frontleft_depth]
    frontleft_depth:
      sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
      point_cloud_topic: /depth_registered/frontleft/points
      max_range: 2.0
      point_subsample: 1
      padding_offset: 0.005
      padding_scale: 1.0
      max_update_rate: 3.0
      filtered_cloud_topic: /moveit_environment/filtered_cloud
    lidar:
      sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
      point_cloud_topic: /moveit_environment/lidar/points
      max_range: 2.0
      point_subsample: 1
      padding_offset: 0.005
      padding_scale: 1.0
      max_update_rate: 3.0
      filtered_cloud_topic: /moveit_environment/lidar/filtered_cloud
