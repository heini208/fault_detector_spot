/**:
  ros__parameters:
    # Measured odom-frame endpoint, verified after the driver reports success.
    base.goal_verification.position_tolerance_m: 0.1
    base.goal_verification.yaw_tolerance_rad: 0.05235987755982989
    base.goal_verification.settle_sec: 0.5
    base.goal_verification.timeout_sec: 5.0
    base.goal_verification.maximum_pose_age_sec: 0.5
    base.goal_verification.settle_position_tolerance_m: 0.005
    base.goal_verification.settle_yaw_tolerance_rad: 0.008726646259971648
    # Two retries after the initial movement; zero disables corrections.
    base.correction.maximum_attempts: 2
    base.correction.minimum_progress_ratio: 0.10
    # Initial tag-correction stability filter. Tune from real robot data.
    base.tag_correction.stability.required_samples: 3
    base.tag_correction.stability.maximum_position_span_m: 0.02
    base.tag_correction.stability.maximum_yaw_span_rad: 0.03490658503988659
    base.tag_correction.stability.maximum_sample_span_sec: 0.5
    # Select normal or precision independently for the two planar commands.
    # Precision is an experimental slower profile, not an accuracy guarantee.
    base.walking.relative_profile: normal
    base.walking.tag_profile: normal
    base.walking.normal.relative_speed_mps: 0.10
    base.walking.normal.tag_speed_mps: 0.15
    base.walking.normal.angular_speed_rad_s: 0.20
    base.walking.normal.gait: auto
    base.walking.precision.relative_speed_mps: 0.05
    base.walking.precision.tag_speed_mps: 0.05
    base.walking.precision.angular_speed_rad_s: 0.10
    base.walking.precision.gait: speed_select_crawl
