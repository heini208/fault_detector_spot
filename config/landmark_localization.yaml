/**:
  ros__parameters:
    # Initial limits to validate with recorded data for the installed cameras,
    # tag sizes and lidar map. Covariance is a quality gate, not a probability
    # that the robot is correctly localized. Angles below are in radians.
    # Maximum acquisition delay at receipt and subsequent gap between advancing
    # processed estimates; processing delay is not counted again on every tick.
    navigation.localization_quality.maximum_age_sec: 1.5
    navigation.localization_quality.maximum_position_std_m: 0.30
    navigation.localization_quality.maximum_yaw_std_rad: 0.17453292519943295  # 10 deg

    # On-demand waypoint/landmark saves may wait for slower processed results,
    # but only from scans acquired after Save. Stream/TF freshness stays 1.5 s.
    navigation.authoring.maximum_localization_delay_sec: 5.0

    # Save only fresh map poses from distinct captures while localization is
    # healthy. A moved tag must be saved again from a known-good localization.
    navigation.landmark_save.required_samples: 3
    navigation.landmark_save.maximum_sample_span_sec: 4.0
    navigation.landmark_save.maximum_position_spread_m: 0.05
    navigation.landmark_save.maximum_rotation_spread_rad: 0.08726646259971647  # 5 deg
    navigation.landmark_save.maximum_observation_age_sec: 1.5

    # Refine only against a fixed map while idle/stationary, from fresh accepted
    # lidar-map registrations. Any initialpose seed blocks refinement for that
    # map/runtime session. Preserve the original pose and bound lifetime drift.
    navigation.landmark_refinement.enabled: true
    navigation.landmark_refinement.required_samples: 5
    navigation.landmark_refinement.maximum_sample_span_sec: 30.0
    navigation.landmark_refinement.maximum_position_spread_m: 0.03
    navigation.landmark_refinement.maximum_rotation_spread_rad: 0.05235987755982989  # 3 deg
    navigation.landmark_refinement.maximum_observation_distance_m: 2.5
    navigation.landmark_refinement.maximum_localization_position_std_m: 0.10
    navigation.landmark_refinement.maximum_localization_yaw_std_rad: 0.05235987755982989  # 3 deg
    navigation.landmark_refinement.gain: 0.10
    navigation.landmark_refinement.maximum_step_position_m: 0.01
    navigation.landmark_refinement.maximum_step_rotation_rad: 0.008726646259971648  # 0.5 deg
    navigation.landmark_refinement.maximum_discrepancy_position_m: 0.15
    navigation.landmark_refinement.maximum_discrepancy_rotation_rad: 0.17453292519943295  # 10 deg
    navigation.landmark_refinement.maximum_cumulative_position_m: 0.05
    navigation.landmark_refinement.maximum_cumulative_rotation_rad: 0.05235987755982989  # 3 deg
    # At most one tag per bounded attempt, no more than once per five minutes.
    # Allow slow lidar results; poll stationarity at 2 Hz only during the attempt.
    # Each geometry sample still needs newly matched, fresh lidar/tag captures.
    navigation.landmark_refinement.attempt_interval_sec: 300.0
    navigation.landmark_refinement.sample_interval_sec: 0.5
    navigation.landmark_refinement.minimum_interval_sec: 300.0
    navigation.landmark_refinement.encounter_absence_sec: 5.0

    # Monitor continuously in localization mode. RTAB-Map consumes initialpose
    # as a reset at its next scan, so issue corrections only when stationary
    # and no command is running. A publish alone never confirms recovery.
    navigation.landmark_recovery.enabled: true
    # High confidence always suppresses new/retried resets, even if a landmark
    # disagrees. Missing/stale/invalid estimates do not establish uncertainty.
    # Finite uncertainty uses separate, more conservative limits than saving.
    # Require matched unsuccessful lidar results throughout a ten-second grace
    # period; accepted matches restart it, unavailable evidence cannot qualify.
    navigation.landmark_recovery.maximum_position_std_m: 0.75
    navigation.landmark_recovery.maximum_yaw_std_rad: 0.4363323129985824  # 25 deg
    navigation.landmark_recovery.lidar_recovery_grace_sec: 10.0
    # Explicit RTAB-Map 9999 "not localized" reports retain the shorter debounce
    # without requiring registration Info. Both paths require distinct poses.
    navigation.landmark_recovery.uncertain_samples: 3
    navigation.landmark_recovery.uncertain_duration_sec: 2.0
    # RTAB-Map results can be seconds apart under load. Recovery allows a bounded
    # five-second stream gap; saves/refinement keep their stricter receipt gate.
    # Acquisition delay on arrival is bounded separately.
    navigation.landmark_recovery.maximum_localization_delay_sec: 5.0
    navigation.landmark_recovery.maximum_localization_gap_sec: 5.0
    navigation.landmark_recovery.required_samples: 5
    navigation.landmark_recovery.maximum_sample_span_sec: 6.0
    navigation.landmark_recovery.maximum_position_spread_m: 0.20
    navigation.landmark_recovery.maximum_rotation_spread_rad: 0.17453292519943295  # 10 deg
    navigation.landmark_recovery.maximum_tag_age_sec: 1.5
    navigation.landmark_recovery.maximum_tag_distance_m: 3.0
    navigation.landmark_recovery.maximum_odometry_age_sec: 0.25
    navigation.landmark_recovery.stationary_duration_sec: 1.0
    navigation.landmark_recovery.stationary_position_tolerance_m: 0.03
    navigation.landmark_recovery.stationary_yaw_tolerance_rad: 0.05235987755982989  # 3 deg
    # Agreement required between simultaneous landmark correction candidates.
    navigation.landmark_recovery.position_error_threshold_m: 0.60
    navigation.landmark_recovery.yaw_error_threshold_rad: 0.3490658503988659  # 20 deg
    navigation.landmark_recovery.recovery_position_tolerance_m: 0.30
    navigation.landmark_recovery.recovery_yaw_tolerance_rad: 0.17453292519943295  # 10 deg
    # Also pauses normal command dispatch after a seed; emergency bypasses it.
    # This bounded pause is not an acknowledgement from RTAB-Map.
    navigation.landmark_recovery.settle_time_sec: 2.0
    navigation.landmark_recovery.retry_interval_sec: 15.0
    navigation.landmark_recovery.maximum_attempts: 3
    navigation.landmark_recovery.healthy_samples: 3
