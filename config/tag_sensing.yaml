/**:
  ros__parameters:
    tag_sensing.base_frame: body
    tag_sensing.base_frame_pattern: 'filtered_fiducial_(\d+)'

    tag_sensing.hand_detection_topic: '/detections'
    tag_sensing.hand_tag_frame_prefix: 'tag36h11:'

    tag_sensing.base_max_age_sec: 1.5
    tag_sensing.hand_max_age_sec: 1.0
    tag_sensing.hand_tf_pending_sec: 0.5

    tag_sensing.hand_max_hamming: 0
    tag_sensing.hand_min_decision_margin: 0.0

    tag_sensing.probe_max_age_sec: 0.25

    inspection.active_object_id: ''
    inspection.active_routine_id: ''
    inspection.execution_frame: odom
    inspection.object_root: ''

    inspection.reference_view_rgb_topic: '/camera/hand/image'
    inspection.reference_view_depth_topic: '/depth_registered/hand/image'
    inspection.reference_view_camera_info_topic: '/depth_registered/hand/camera_info'
    inspection.reference_view_base_tag_topic: 'fault_detector/state/visible_tags'

    inspection.reference_view_sync_queue_size: 10
    inspection.reference_view_maximum_input_age_sec: 0.75
    inspection.reference_view_maximum_timestamp_skew_sec: 0.05
    inspection.reference_view_maximum_tag_timestamp_skew_sec: 0.25
    inspection.reference_view_fixed_frame: odom
    inspection.reference_view_transform_timeout_sec: 0.05
    inspection.reference_view_capture_timeout_sec: 3.0
