# Single source of arm-motion defaults. ROS parameter overrides take precedence.
# Add settings here, then read them with ArmMotionParameters.get() where used.
# Settings are loaded at process startup; editing this file is not hot reload.
/**:
  ros__parameters:
    # Contact telemetry
    arm.contact.telemetry.raw_logging_enabled: true

    # Cartesian movement speed
    arm.motion.linear_speed_mps: 0.08
    arm.motion.angular_speed_rad_s: 0.50
    arm.motion.minimum_duration_sec: 0.50
    arm.motion.moveit_result_timeout_margin_sec: 15.0

    # Ready pose speed, offsets, and state waits
    arm.ready_linear_speed_mps: 0.1
    arm.ready_forward_distance_m: 0.05
    arm.ready_lift_distance_m: 0.1
    arm.ready_state_timeout_sec: 2.0
    arm.ready_tf_timeout_sec: 2.0
    arm.ready_deployed_timeout_sec: 2.0
    arm.stow_state_timeout_sec: 2.0

    # Stationary force baseline
    arm.force_baseline.minimum_samples: 10
    arm.force_baseline.minimum_span_sec: 0.50
    arm.force_baseline.maximum_component_span_n: 3.0
    arm.force_baseline.timeout_sec: 2.0

    # Contact detection and retreat
    arm.contact.minimum_force_delta_threshold_n: 3.0
    arm.contact.reference_linear_speed_mps: 0.005
    arm.contact.reference_angular_speed_rad_s: 0.50
    arm.contact.reference_force_delta_threshold_n: 5.0
    arm.contact.maximum_force_delta_threshold_n: 10.0
    arm.contact.consecutive_samples: 2
    arm.contact.force_stale_timeout_sec: 0.25
    arm.contact.retreat_distance_m: 0.010
    arm.contact.retreat_speed_mps: 0.010

    arm.contact.shadow.off_axis_speed_threshold_mps: 0.040