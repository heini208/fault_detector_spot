map_server:
  ros__parameters:
    enabled: false

amcl:
  ros__parameters:
    enabled: false

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    autostart: false
    controller_plugins: ["MPPI"]
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      max_cmd_vel_x: 0.5
      max_cmd_vel_theta: 0.7
      min_cmd_vel_x: -0.1
      acc_lim_x: 0.8
      acc_lim_theta: 1.5
      time_horizon: 1.5
      time_step: 0.1
      num_samples: 64
      num_elites: 8
      lambda: 1.0
      noise_std_dev_x: 0.1
      noise_std_dev_theta: 0.25
      goal_tolerance: 0.10
      stop_on_goal: true

    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: false

global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    static_map: false
    map_subscribe_transient_local: true
    topic: /map
    update_frequency: 3.0
    publish_frequency: 1.0
    rolling_window: false
    resolution: 0.05
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: velodyne
      observation_persistence: 0.3
      velodyne:
        topic: /velodyne/points_filtered
        data_type: PointCloud2
        marking: true
        clearing: true
        obstacle_range: 10.0
        raytrace_range: 12.0
        min_obstacle_height: -0.20
        max_obstacle_height: 1.50
        expected_update_rate: 0.2

    robot_radius: 0.55

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.45
      cost_scaling_factor: 3.0

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 10.0
    publish_frequency: 5.0
    rolling_window: true
    width: 8.0
    height: 8.0
    resolution: 0.05
    plugins: ["voxel_layer", "inflation_layer"]

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      origin_z: -0.30
      z_resolution: 0.05
      z_voxels: 32
      unknown_threshold: 15
      marking_threshold: 1
      observation_sources: velodyne
      velodyne:
        topic: /velodyne/points_filtered
        data_type: PointCloud2
        marking: true
        clearing: true
        obstacle_range: 10.0
        raytrace_range: 12.0
        min_obstacle_height: -0.20
        max_obstacle_height: 1.50
        expected_update_rate: 0.2

    robot_radius: 0.55

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.45
      cost_scaling_factor: 3.0

bt_navigator:
  ros__parameters:
    autostart: false
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"