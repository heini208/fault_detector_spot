/**:
  ros__parameters:
    # Monotonic deadlines; timeout retains ownership and never retries motion.
    command.ack_timeout_sec: 3.0
    command.heartbeat_timeout_sec: 5.0
    command.reconciliation_interval_sec: 1.0
    command.query_timeout_sec: 2.0
    command.poll_period_sec: 0.1
    # Callback processing remains available throughout stop confirmation.
    shutdown.confirmation_timeout_sec: 10.0
    shutdown.cleanup_timeout_sec: 20.0
