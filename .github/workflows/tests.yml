name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/heini208/fault-detector-ci:humble-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout fault_detector_spot
        uses: actions/checkout@v4
        with:
          path: ros_ws/src/fault_detector_spot

      - name: Checkout fault_detector_msgs
        uses: actions/checkout@v4
        with:
          repository: heini208/fault_detector_msgs
          path: ros_ws/src/fault_detector_msgs

      - name: Build fault_detector_msgs
        working-directory: ros_ws
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source /opt/fault_detector_underlay/setup.bash
          colcon build --merge-install --packages-select fault_detector_msgs

      - name: Run fault_detector_spot tests
        working-directory: ros_ws/src/fault_detector_spot
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source /opt/fault_detector_underlay/setup.bash
          source ../../install/setup.bash
          python3 -m pytest -q -m 'not linter'
