name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout fault_detector_spot
        uses: actions/checkout@v4
        with:
          path: ros_ws/src/fault_detector_spot

      - name: Checkout fault_detector_msgs
        uses: actions/checkout@v4
        with:
          repository: heini208/fault_detector_msgs
          path: ros_ws/src/fault_detector_msgs

      - name: Checkout pinned Spot ROS 2
        uses: actions/checkout@v4
        with:
          repository: RAI-Opensource/spot_ros2
          ref: dbbac7a0afac1766ad43151f8a4b55651066bff1
          submodules: recursive
          path: ros_ws/src/spot_ros2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spot ROS 2 CI image
        uses: docker/build-push-action@v6
        with:
          context: ros_ws/src/spot_ros2
          file: ros_ws/src/spot_ros2/.devcontainer/Dockerfile
          load: true
          push: false
          tags: fault-detector-spot-ci:humble
          cache-from: type=gha,scope=spot-ros2-humble
          cache-to: type=gha,mode=max,scope=spot-ros2-humble

      - name: Build and test fault_detector_spot
        shell: bash
        run: |
          docker run --rm \
            -e QT_QPA_PLATFORM=offscreen \
            -v "${GITHUB_WORKSPACE}/ros_ws:/workspace/ros_ws" \
            -w /workspace/ros_ws \
            fault-detector-spot-ci:humble \
            bash -lc '
              source /opt/ros/humble/setup.bash
              rosdep update
              rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
              colcon build --symlink-install --packages-up-to fault_detector_spot
              source install/setup.bash
              cd src/fault_detector_spot
              python3 -m pytest -q -m "not linter"
            '
